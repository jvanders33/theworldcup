<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Road to Glory — Can your all-time XI go 8-0? | The World Cup</title>
<meta name="description" content="Draft your all-time World Cup XI and simulate an undefeated run to the trophy. Can you go 8-0? Share your record.">
<meta property="og:title" content="Road to Glory — Can your all-time XI go 8-0?">
<meta property="og:description" content="Draft your all-time World Cup XI and beat the bracket. Build your team, share your record.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@500;600;700&family=Barlow+Condensed:wght@600;700;800&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#060709;--card:rgba(255,255,255,0.03);--border:rgba(255,255,255,0.07);--gold:#f5c518;--green:#00e676;--red:#ff5277;--text:#f0f2f5;--muted:#5a6070;--muted2:#8892a4}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;min-height:100vh}
  .radar{position:fixed;inset:0;z-index:0;background:radial-gradient(circle at 50% 12%,rgba(0,90,55,0.32),transparent 58%)}
  .wrap{position:relative;z-index:1;max-width:940px;margin:0 auto;padding:30px 18px 70px}
  .eyebrow{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);font-size:.76rem;text-align:center}
  h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(2.6rem,8vw,4.6rem);line-height:.9;text-align:center;margin-top:6px}
  .sub{color:var(--muted2);text-align:center;max-width:540px;margin:12px auto 0;font-size:1rem;line-height:1.5}
  .bar{display:flex;align-items:center;justify-content:center;gap:18px;margin:22px 0 8px;flex-wrap:wrap}
  .rating{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted2);font-size:.92rem}
  .rating b{font-family:'DM Mono',monospace;color:var(--gold);font-size:1.2rem}
  .mini{background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:8px 14px;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:.8rem}
  .mini:hover{border-color:rgba(245,197,24,0.4);color:var(--gold)}
  .lineup{display:flex;flex-direction:column;gap:14px;margin-top:18px}
  .lrow{display:grid;gap:10px}
  .lrow.d4{grid-template-columns:repeat(4,1fr)}
  .lrow.m3{grid-template-columns:repeat(3,1fr)}
  .lrow.f3{grid-template-columns:repeat(3,1fr)}
  .lrow.g1{grid-template-columns:1fr;max-width:240px;margin:0 auto}
  .poslab{text-align:center;font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-size:.68rem;margin-bottom:-6px}
  .slot select{width:100%;background:#0b0d11;color:var(--text);border:1px solid var(--border);border-radius:10px;padding:11px 9px;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:.94rem}
  .slot select:focus{outline:none;border-color:rgba(245,197,24,0.5)}
  .go{display:block;width:100%;max-width:420px;margin:26px auto 0;border:none;cursor:pointer;background:var(--gold);color:#1a1205;padding:16px;border-radius:13px;font-family:'Barlow Condensed',sans-serif;font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:1.1rem}
  .go:disabled{opacity:.4;cursor:not-allowed}
  .go:not(:disabled):hover{background:#ffd83a}
  .result{margin-top:30px;display:none}
  .verdict{text-align:center}
  .verdict .big{font-family:'Bebas Neue',sans-serif;font-size:clamp(2.4rem,9vw,4.4rem);line-height:.92}
  .verdict .big.champ{color:var(--gold)}
  .verdict .rec{font-family:'DM Mono',monospace;color:var(--muted2);margin-top:4px;letter-spacing:.1em}
  .rounds{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:9px;margin-top:20px}
  .rd{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:11px 13px;display:flex;justify-content:space-between;align-items:center}
  .rd .stg{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.04em;color:var(--muted2);font-size:.84rem}
  .rd .sc{font-family:'DM Mono',monospace;font-size:.95rem}
  .rd.w{border-color:rgba(0,230,118,0.3)} .rd.w .sc{color:var(--green)}
  .rd.l{border-color:rgba(255,82,119,0.4)} .rd.l .sc{color:var(--red)}
  .actions{display:flex;gap:10px;justify-content:center;margin-top:24px;flex-wrap:wrap}
  .btn{border:none;cursor:pointer;padding:13px 22px;border-radius:11px;font-family:'Barlow Condensed',sans-serif;font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:.92rem}
  .btn-dl{background:var(--gold);color:#1a1205}
  .btn-x{background:rgba(255,255,255,0.05);color:var(--text);border:1px solid var(--border)}
  .btn-x:hover{border-color:rgba(245,197,24,0.4);color:var(--gold)}
  .btn-again{background:transparent;color:var(--muted2);border:1px solid var(--border)}
  canvas{display:none}
  .cardprev{display:block;max-width:420px;width:100%;margin:22px auto 0;border-radius:14px;border:1px solid var(--border)}
  .foot{text-align:center;color:var(--muted);font-size:.78rem;margin-top:34px;line-height:1.5}
  .foot a{color:var(--muted2)}
</style>
</head>
<body>
<div class="radar"></div>
<div class="wrap">
  <div class="eyebrow">The World Cup · on Solana</div>
  <h1>Road to Glory</h1>
  <p class="sub">Draft your all-time World Cup XI, then send them through the bracket. Three group games, five knockouts. Can you go <b style="color:var(--gold)">8-0</b> and lift the trophy?</p>

  <div class="bar">
    <div class="rating">Squad rating <b id="rt">—</b></div>
    <button class="mini" id="best">Dream XI</button>
    <button class="mini" id="rand">Randomise</button>
    <button class="mini" id="clear">Clear</button>
  </div>

  <div class="lineup" id="lineup"></div>
  <button class="go" id="sim" disabled>Pick 11 to simulate</button>

  <div class="result" id="result">
    <div class="verdict">
      <div class="big" id="vbig"></div>
      <div class="rec" id="vrec"></div>
    </div>
    <div class="rounds" id="rounds"></div>
    <img class="cardprev" id="cardprev" alt="Your result card">
    <div class="actions">
      <button class="btn btn-dl" id="dl">Download card</button>
      <button class="btn btn-x" id="share">Share to X</button>
      <button class="btn btn-again" id="again">New run</button>
    </div>
  </div>

  <div class="foot">Unofficial fan game · not affiliated with FIFA or any player · built on <a href="https://theworldcup.gg">theworldcup.gg</a></div>
</div>
<canvas id="cv" width="1080" height="1080"></canvas>

<script>
const POOL=[
 {n:'Lev Yashin',p:'GK',r:95},{n:'Gianluigi Buffon',p:'GK',r:94},{n:'Manuel Neuer',p:'GK',r:93},{n:'Iker Casillas',p:'GK',r:92},{n:'Dino Zoff',p:'GK',r:91},{n:'Oliver Kahn',p:'GK',r:90},{n:'Gordon Banks',p:'GK',r:90},{n:'Peter Schmeichel',p:'GK',r:89},{n:'Emiliano Martínez',p:'GK',r:87},
 {n:'Franz Beckenbauer',p:'DEF',r:97},{n:'Paolo Maldini',p:'DEF',r:96},{n:'Franco Baresi',p:'DEF',r:94},{n:'Cafu',p:'DEF',r:93},{n:'Roberto Carlos',p:'DEF',r:93},{n:'Fabio Cannavaro',p:'DEF',r:92},{n:'Sergio Ramos',p:'DEF',r:91},{n:'Philipp Lahm',p:'DEF',r:91},{n:'Carles Puyol',p:'DEF',r:90},{n:'Virgil van Dijk',p:'DEF',r:90},{n:'Daniel Passarella',p:'DEF',r:89},{n:'Giacinto Facchetti',p:'DEF',r:89},{n:'Marcel Desailly',p:'DEF',r:89},{n:'Lúcio',p:'DEF',r:88},
 {n:'Zinedine Zidane',p:'MID',r:98},{n:'Michel Platini',p:'MID',r:95},{n:'Xavi',p:'MID',r:94},{n:'Andrés Iniesta',p:'MID',r:94},{n:'Lothar Matthäus',p:'MID',r:93},{n:'Bobby Charlton',p:'MID',r:93},{n:'Zico',p:'MID',r:93},{n:'Luka Modrić',p:'MID',r:92},{n:'Andrea Pirlo',p:'MID',r:92},{n:'Frank Rijkaard',p:'MID',r:90},{n:'Sócrates',p:'MID',r:90},{n:'Paul Scholes',p:'MID',r:88},{n:'Steven Gerrard',p:'MID',r:88},
 {n:'Pelé',p:'FWD',r:99},{n:'Diego Maradona',p:'FWD',r:99},{n:'Lionel Messi',p:'FWD',r:99},{n:'Johan Cruyff',p:'FWD',r:97},{n:'Ronaldo Nazário',p:'FWD',r:97},{n:'Cristiano Ronaldo',p:'FWD',r:96},{n:'Gerd Müller',p:'FWD',r:95},{n:'Garrincha',p:'FWD',r:95},{n:'Marco van Basten',p:'FWD',r:94},{n:'Ronaldinho',p:'FWD',r:94},{n:'Eusébio',p:'FWD',r:94},{n:'Romário',p:'FWD',r:93},{n:'Kylian Mbappé',p:'FWD',r:93},{n:'Thierry Henry',p:'FWD',r:92},{n:'Roberto Baggio',p:'FWD',r:92},{n:'George Best',p:'FWD',r:92},{n:'Gabriel Batistuta',p:'FWD',r:91},{n:'Neymar',p:'FWD',r:91},{n:'Just Fontaine',p:'FWD',r:91},{n:'Miroslav Klose',p:'FWD',r:90}
];
const FORM=[['FWD',3,'f3','Forwards'],['MID',3,'m3','Midfield'],['DEF',4,'d4','Defence'],['GK',1,'g1','Goalkeeper']];
const SLOTS=[]; FORM.forEach(([pos,n])=>{for(let i=0;i<n;i++)SLOTS.push({pos:pos,val:''});});

const lineupEl=document.getElementById('lineup');
function buildUI(){
  lineupEl.innerHTML='';
  FORM.forEach(([pos,n,cls,lab])=>{
    const wrap=document.createElement('div');
    const pl=document.createElement('div');pl.className='poslab';pl.textContent=lab;wrap.appendChild(pl);
    const row=document.createElement('div');row.className='lrow '+cls;
    SLOTS.forEach((s,idx)=>{ if(s.pos!==pos)return;
      const cell=document.createElement('div');cell.className='slot';
      const sel=document.createElement('select');sel.dataset.idx=idx;
      sel.addEventListener('change',function(){SLOTS[idx].val=this.value;refresh();});
      cell.appendChild(sel);row.appendChild(cell);
    });
    wrap.appendChild(row);lineupEl.appendChild(wrap);
  });
  refresh();
}
function refresh(){
  const used=SLOTS.map(s=>s.val).filter(Boolean);
  document.querySelectorAll('.slot select').forEach(sel=>{
    const idx=+sel.dataset.idx, s=SLOTS[idx];
    const opts=POOL.filter(p=>p.p===s.pos).sort((a,b)=>b.r-a.r);
    sel.innerHTML='<option value="">— pick —</option>'+opts.map(p=>{
      const taken=used.includes(p.n)&&p.n!==s.val;
      return '<option value="'+p.n+'"'+(p.n===s.val?' selected':'')+(taken?' disabled':'')+'>'+p.n+' · '+p.r+'</option>';
    }).join('');
  });
  const picked=SLOTS.filter(s=>s.val).map(s=>POOL.find(p=>p.n===s.val));
  const full=picked.length===11;
  const rt=picked.length?Math.round(picked.reduce((a,p)=>a+p.r,0)/picked.length):0;
  document.getElementById('rt').textContent=picked.length?rt:'—';
  const go=document.getElementById('sim');go.disabled=!full;go.textContent=full?'Simulate the run':'Pick 11 to simulate ('+picked.length+'/11)';
}
function fill(mode){
  const usedNames=[];
  SLOTS.forEach(s=>{
    const opts=POOL.filter(p=>p.p===s.pos&&!usedNames.includes(p.n)).sort((a,b)=>b.r-a.r);
    let pick;
    if(mode==='best')pick=opts[0];
    else pick=opts[Math.floor(Math.random()*Math.min(opts.length, s.pos==='GK'?opts.length:8))];
    s.val=pick?pick.n:''; if(pick)usedNames.push(pick.n);
  });
  refresh();
}
document.getElementById('best').onclick=()=>fill('best');
document.getElementById('rand').onclick=()=>fill('rand');
document.getElementById('clear').onclick=()=>{SLOTS.forEach(s=>s.val='');refresh();document.getElementById('result').style.display='none';};

const STAGES=[['Group A',74],['Group B',77],['Group C',81],['Round of 32',84],['Round of 16',87],['Quarter-final',90],['Semi-final',93],['Final',96]];
function scoreline(win,diff){
  if(win){let h=1+Math.min(4,Math.round(Math.random()*1.6+Math.max(0,diff)/9));let a=Math.round(Math.random()*Math.max(0,h-1));return h+'–'+a;}
  let a=1+Math.round(Math.random()*2);let h=Math.round(Math.random()*Math.max(0,a-1));return h+'–'+a;
}
let LAST=null;
function simulate(){
  const picked=SLOTS.map(s=>POOL.find(p=>p.n===s.val));
  const rt=picked.reduce((a,p)=>a+p.r,0)/11;
  const runs=[]; let out=null;
  for(let i=0;i<STAGES.length;i++){
    const [stg,opp]=STAGES[i]; const diff=rt-opp;
    const pWin=1/(1+Math.exp(-diff/6)); const win=Math.random()<pWin;
    runs.push({stg:stg,win:win,sc:scoreline(win,diff)});
    if(!win){out=stg;break;}
  }
  const champ=!out; const wins=runs.filter(r=>r.win).length;
  LAST={picked:picked,rt:Math.round(rt),runs:runs,champ:champ,out:out,wins:wins};
  showResult();
}
function showResult(){
  const R=LAST, res=document.getElementById('result');res.style.display='block';
  const big=document.getElementById('vbig');
  if(R.champ){big.textContent='CHAMPIONS';big.className='big champ';document.getElementById('vrec').textContent='Unbeaten · 8–0 · world on top';}
  else{big.textContent='OUT — '+R.out.toUpperCase();big.className='big';document.getElementById('vrec').textContent=R.wins+' win'+(R.wins===1?'':'s')+' · the dream ends here';}
  const rd=document.getElementById('rounds');rd.innerHTML='';
  R.runs.forEach(x=>{const e=document.createElement('div');e.className='rd '+(x.win?'w':'l');
    e.innerHTML='<span class="stg">'+x.stg+'</span><span class="sc">'+(x.win?'W ':'L ')+x.sc+'</span>';rd.appendChild(e);});
  drawCard();
  res.scrollIntoView({behavior:'smooth',block:'start'});
}
document.getElementById('sim').onclick=simulate;
document.getElementById('again').onclick=simulate;

// ---------- share card ----------
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function chip(x,y,w,h,name){
  rr(x,y,w,h,10);ctx.fillStyle='rgba(255,255,255,0.07)';ctx.fill();ctx.strokeStyle='rgba(245,197,24,0.35)';ctx.lineWidth=1.5;ctx.stroke();
  ctx.fillStyle='#f0f2f5';ctx.textAlign='center';ctx.textBaseline='middle';
  let s=24;ctx.font='700 '+s+"px 'Barlow Condensed'";while(ctx.measureText(name).width>w-16&&s>13){s-=1;ctx.font='700 '+s+"px 'Barlow Condensed'";}
  ctx.fillText(name,x+w/2,y+h/2);
}
function drawCard(){
  const R=LAST;const W=1080,H=1080;
  ctx.clearRect(0,0,W,H);ctx.fillStyle='#060709';ctx.fillRect(0,0,W,H);
  const g=ctx.createRadialGradient(W/2,300,40,W/2,300,760);g.addColorStop(0,'rgba(16,46,33,0.9)');g.addColorStop(1,'rgba(6,7,9,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(245,197,24,0.4)';ctx.lineWidth=2;ctx.strokeRect(20,20,W-40,H-40);
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#f5c518';ctx.font="700 30px 'Barlow Condensed'";ctx.letterSpacing='9px';ctx.fillText('ROAD TO GLORY · 2026',W/2,80);ctx.letterSpacing='0px';
  // verdict
  ctx.font="120px 'Bebas Neue'";
  if(R.champ){ctx.fillStyle='#f5c518';ctx.fillText('CHAMPIONS',W/2,180);ctx.fillStyle='#f0f2f5';ctx.font="700 40px 'Barlow Condensed'";ctx.fillText('UNBEATEN · 8–0',W/2,250);}
  else{ctx.fillStyle='#f0f2f5';ctx.font="92px 'Bebas Neue'";ctx.fillText('OUT — '+R.out.toUpperCase(),W/2,180);ctx.fillStyle='#8892a4';ctx.font="700 38px 'Barlow Condensed'";ctx.fillText(R.wins+' WIN'+(R.wins===1?'':'S')+' · SQUAD '+R.rt,W/2,248);}
  // pitch
  const px=70,py=300,pw=W-140,ph=628;
  ctx.fillStyle='#0a2a18';rr(px,py,pw,ph,16);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=2;
  ctx.strokeRect(px+20,py+20,pw-40,ph-40);
  ctx.beginPath();ctx.moveTo(px+20,py+ph/2);ctx.lineTo(px+pw-20,py+ph/2);ctx.stroke();
  ctx.beginPath();ctx.arc(W/2,py+ph/2,60,0,7);ctx.stroke();
  // rows: FWD, MID, DEF, GK from top
  const rows=[['FWD',3],['MID',3],['DEF',4],['GK',1]];
  const ys=[py+78,py+228,py+396,py+552];
  let pickByPos={FWD:[],MID:[],DEF:[],GK:[]};
  R.picked.forEach(p=>pickByPos[p.p].push(p.n));
  rows.forEach((row,ri)=>{const pos=row[0],cnt=row[1],names=pickByPos[pos];
    const cw=cnt===4?210:230,gap=(pw-40-cw*cnt)/(cnt+1);
    for(let i=0;i<cnt;i++){const x=px+20+gap*(i+1)+cw*i;chip(x,ys[ri]-32,cw,64,names[i]||'—');}
  });
  // footer
  ctx.fillStyle='#5a6070';ctx.font="500 24px 'DM Mono'";ctx.letterSpacing='2px';ctx.textAlign='center';ctx.fillText('theworldcup.gg',W/2,985);ctx.letterSpacing='0px';
  document.getElementById('cardprev').src=cv.toDataURL('image/png');
}
function download(){const a=document.createElement('a');a.download='theworldcup-road-to-glory.png';cv.toBlob(b=>{a.href=URL.createObjectURL(b);a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);});}
function share(){download();const R=LAST;
  const t=R.champ?'My all-time XI went 8-0 and won the World Cup 🏆 Can yours?':'My all-time XI went out in the '+R.out+'. Can you go 8-0?';
  setTimeout(()=>window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(t+'\n\n')+'&url='+encodeURIComponent('https://theworldcup.gg'),'_blank','noopener'),350);}
document.getElementById('dl').onclick=download;
document.getElementById('share').onclick=share;

buildUI();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(LAST)drawCard();});
</script>
</body>
</html>
